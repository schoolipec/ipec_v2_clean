version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: strapi_ipec
      POSTGRES_USER: strapi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - strapi-network

  strapi:
    image: strapi/strapi:v5-latest
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi_ipec
      DATABASE_USERNAME: strapi_user
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      DATABASE_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-change_me_in_production}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change_me_in_production}
      APP_KEYS: ${APP_KEYS:-change_me_in_production}
      NODE_ENV: production
    volumes:
      - strapi_data:/strapi/strapi
    ports:
      - "1337:1337"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - strapi-network

volumes:
  postgres_data:
  strapi_data:

networks:
  strapi-network:
    driver: bridge
